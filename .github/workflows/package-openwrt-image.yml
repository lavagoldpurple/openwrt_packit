name: Package E20C OpenWrt image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs dosfstools e2fsprogs fdisk parted gawk uuid-runtime \
            util-linux curl tar xz-utils zstd pigz patch perl jq

      - name: Check asset validation
        run: |
          bash tests/test_e20c_assets.sh
          bash tests/test_e20c_cleanup.sh

      - name: Package E20C image
        uses: ./

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-e20c
          path: |
            output/*.img.gz
            output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
