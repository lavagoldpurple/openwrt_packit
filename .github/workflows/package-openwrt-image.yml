name: Package E20C OpenWrt image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs dosfstools e2fsprogs fdisk parted gawk uuid-runtime \
            util-linux curl tar xz-utils zstd pigz patch perl jq busybox-static

      - name: Check asset validation
        run: |
          for script in openwrt_flippy.sh mk_rk3528_e20c.sh public_funcs files/install_mariadb.sh files/configure_e20c_services.sh files/verify_mariadb_status.sh files/verify_first_boot_tools.sh tests/*.sh; do
            bash -n "$script"
          done
          for script in files/first_run.sh files/e20c-data-mounted; do
            sh -n "$script"
          done
          bash tests/test_e20c_assets.sh
          bash tests/test_e20c_cleanup.sh
          bash tests/test_e20c_single_system.sh
          sudo bash tests/test_e20c_readonly_tools.sh

      - name: Package E20C image
        uses: ./

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-e20c
          path: |
            output/*.img.gz
            output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
